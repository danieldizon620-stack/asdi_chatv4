<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Server Settings</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#111827;color:#f8fafc;margin:0;padding:26px}h2{margin:0 0 14px;color:#ff424a}label{display:block;font-weight:600;margin:16px 0 8px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #64748b;border-radius:7px;background:#1f2937;color:white;font-size:14px}p{color:#cbd5e1;font-size:13px;line-height:1.5}button{background:#ed1b2f;color:white;border:0;border-radius:6px;padding:11px 22px;cursor:pointer;font-weight:600}#status{min-height:20px;color:#fecaca}</style></head><body><h2>ASDI_Ticketing</h2><p>Configure the address of your ASDI Ticketing server. The messenger will open the chatroom directly after login.</p><form id="form"><label for="server">Server URL</label><input id="server" type="url" required placeholder="http://192.168.1.10:8080/asdi_ticketing/"><p>Example: http://100.69.232.118:8080/asdi_ticketing/</p><button type="submit">Save &amp; Connect</button><p id="status" role="status"></p></form><script src="settings.js"></script></body></html>
